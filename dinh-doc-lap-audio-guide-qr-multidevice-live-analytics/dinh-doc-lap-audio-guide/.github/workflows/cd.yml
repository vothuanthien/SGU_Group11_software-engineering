name: CD
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            frontend,
            backend/api-gateway,
            backend/auth-service,
            backend/attraction-service,
            backend/narration-service,
            backend/feedback-service,
            backend/analytics-service,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: ${{ matrix.package }}
      - run: npm run lint
        working-directory: ${{ matrix.package }}
      - run: npm test
        working-directory: ${{ matrix.package }}
      - if: matrix.package == 'frontend'
        run: npm run build
        working-directory: ${{ matrix.package }}
      - if: matrix.package != 'frontend'
        run: node --check src/index.js
        working-directory: ${{ matrix.package }}
  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dinh-guide-frontend:${{ github.ref_name }}
      - name: Build and push services
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/dinh-guide
          TAG: ${{ github.ref_name }}
        run: |
          for service in api-gateway auth-service attraction-service narration-service feedback-service analytics-service; do
            docker build -t "$IMAGE_PREFIX-$service:$TAG" "backend/$service"
            docker push "$IMAGE_PREFIX-$service:$TAG"
          done
      - name: Check whether SSH deployment is configured
        id: deploy-config
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_PATH" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Optional SSH deploy
        if: steps.deploy-config.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd '${{ secrets.DEPLOY_PATH }}'
            export IMAGE_OWNER='${{ github.repository_owner }}'
            export IMAGE_TAG='${{ github.ref_name }}'
            docker compose pull
            docker compose up -d --remove-orphans
            sleep 8
            curl --fail http://localhost:4000/api/v1/health
