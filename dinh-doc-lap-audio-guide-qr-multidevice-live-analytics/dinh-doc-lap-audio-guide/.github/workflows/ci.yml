name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [frontend, backend/api-gateway, backend/auth-service, backend/attraction-service, backend/narration-service, backend/feedback-service, backend/analytics-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: ${{ matrix.package }}
      - run: npm run lint
        working-directory: ${{ matrix.package }}
      - run: npm test
        working-directory: ${{ matrix.package }}
      - if: matrix.package == 'frontend'
        run: npm run build
        working-directory: ${{ matrix.package }}
      - if: matrix.package != 'frontend'
        run: node --check src/index.js
        working-directory: ${{ matrix.package }}
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

