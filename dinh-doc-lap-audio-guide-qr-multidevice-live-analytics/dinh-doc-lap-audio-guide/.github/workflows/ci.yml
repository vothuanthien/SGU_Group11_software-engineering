name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            frontend,
            backend/api-gateway,
            backend/content-service,
            backend/auth-service,
            backend/attraction-service,
            backend/narration-service,
            backend/feedback-service,
            backend/analytics-service,
            backend/navigation-service,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: dinh-doc-lap-audio-guide-qr-multidevice-live-analytics/dinh-doc-lap-audio-guide/${{ matrix.package }}
      - run: npm run lint
        working-directory: dinh-doc-lap-audio-guide-qr-multidevice-live-analytics/dinh-doc-lap-audio-guide/${{ matrix.package }}
      - run: npm test
        working-directory: dinh-doc-lap-audio-guide-qr-multidevice-live-analytics/dinh-doc-lap-audio-guide/${{ matrix.package }}
      - if: matrix.package == 'frontend'
        run: npm run build
        working-directory: dinh-doc-lap-audio-guide-qr-multidevice-live-analytics/dinh-doc-lap-audio-guide/${{ matrix.package }}
      - if: matrix.package != 'frontend'
        run: node --check src/index.js
        working-directory: dinh-doc-lap-audio-guide-qr-multidevice-live-analytics/dinh-doc-lap-audio-guide/${{ matrix.package }}
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ephemeral Compose build credentials
        shell: bash
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: docker compose build
        working-directory: dinh-doc-lap-audio-guide-qr-multidevice-live-analytics/dinh-doc-lap-audio-guide
  integration:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: dinh-guide-integration-${{ github.run_id }}-${{ github.run_attempt }}
      API_BASE_URL: http://127.0.0.1:4000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure ephemeral integration credentials
        shell: bash
        run: |
          admin_password="$(openssl rand -hex 24)"
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ADMIN_EMAIL=integration-admin@example.invalid" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "TEST_ADMIN_EMAIL=integration-admin@example.invalid" >> "$GITHUB_ENV"
          echo "TEST_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
      - name: Start isolated Docker Compose stack
        run: docker compose up --build --detach
        working-directory: dinh-doc-lap-audio-guide-qr-multidevice-live-analytics/dinh-doc-lap-audio-guide
      - name: Exercise API and PostgreSQL integration
        run: node --test scripts/integration.test.mjs
        working-directory: dinh-doc-lap-audio-guide-qr-multidevice-live-analytics/dinh-doc-lap-audio-guide
      - name: Stop and remove isolated stack
        if: always()
        run: docker compose down --volumes --remove-orphans
        working-directory: dinh-doc-lap-audio-guide-qr-multidevice-live-analytics/dinh-doc-lap-audio-guide
