services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dinhguide}
      POSTGRES_USER: ${POSTGRES_USER:-dinhguide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  database-migration:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-dinhguide}
      PGUSER: ${POSTGRES_USER:-dinhguide}
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - ./database/migrations/001_narration_publication.sql:/migrations/001_narration_publication.sql:ro
      - ./database/migrations/002_visitor_analytics.sql:/migrations/002_visitor_analytics.sql:ro
    command:
      [
        "sh",
        "-c",
        "psql -v ON_ERROR_STOP=1 -f /migrations/001_narration_publication.sql && psql -v ON_ERROR_STOP=1 -f /migrations/002_visitor_analytics.sql",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  auth-service:
    image: ghcr.io/${IMAGE_OWNER:-local}/dinh-guide-auth-service:${IMAGE_TAG:-local}
    build: ./backend/auth-service
    environment:
      PORT: 4101
      DATABASE_URL: postgres://${POSTGRES_USER:-dinhguide}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-dinhguide}
      JWT_SECRET: ${JWT_SECRET:?required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4101/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
  attraction-service:
    image: ghcr.io/${IMAGE_OWNER:-local}/dinh-guide-attraction-service:${IMAGE_TAG:-local}
    build: ./backend/attraction-service
    environment:
      PORT: 4102
      JWT_SECRET: ${JWT_SECRET:?required}
      DATABASE_URL: postgres://${POSTGRES_USER:-dinhguide}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-dinhguide}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4102/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
  narration-service:
    image: ghcr.io/${IMAGE_OWNER:-local}/dinh-guide-narration-service:${IMAGE_TAG:-local}
    build: ./backend/narration-service
    environment:
      PORT: 4103
      DATABASE_URL: postgres://${POSTGRES_USER:-dinhguide}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-dinhguide}
      JWT_SECRET: ${JWT_SECRET:?required}
      ATTRACTION_SERVICE_URL: http://attraction-service:4102
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4103/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
  content-service:
    image: ghcr.io/${IMAGE_OWNER:-local}/dinh-guide-content-service:${IMAGE_TAG:-local}
    build: ./backend/content-service
    environment:
      PORT: 4106
      ATTRACTION_SERVICE_URL: http://attraction-service:4102
      NARRATION_SERVICE_URL: http://narration-service:4103
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4106/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      attraction-service:
        condition: service_healthy
      narration-service:
        condition: service_healthy
    restart: unless-stopped
  navigation-service:
    image: ghcr.io/${IMAGE_OWNER:-local}/dinh-guide-navigation-service:${IMAGE_TAG:-local}
    build: ./backend/navigation-service
    environment:
      PORT: 4107
      ATTRACTION_SERVICE_URL: http://attraction-service:4102
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4107/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      attraction-service:
        condition: service_healthy
    restart: unless-stopped
  feedback-service:
    image: ghcr.io/${IMAGE_OWNER:-local}/dinh-guide-feedback-service:${IMAGE_TAG:-local}
    build: ./backend/feedback-service
    environment:
      PORT: 4104
      DATABASE_URL: postgres://${POSTGRES_USER:-dinhguide}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-dinhguide}
      ATTRACTION_SERVICE_URL: http://attraction-service:4102
      JWT_SECRET: ${JWT_SECRET:?required}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4104/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
  analytics-service:
    image: ghcr.io/${IMAGE_OWNER:-local}/dinh-guide-analytics-service:${IMAGE_TAG:-local}
    build: ./backend/analytics-service
    environment:
      PORT: 4105
      DATABASE_URL: postgres://${POSTGRES_USER:-dinhguide}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-dinhguide}
      JWT_SECRET: ${JWT_SECRET:?required}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4105/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      database-migration:
        condition: service_completed_successfully
    restart: unless-stopped
  sqlserver-sync:
    image: ghcr.io/${IMAGE_OWNER:-local}/dinh-guide-sqlserver-sync:${IMAGE_TAG:-local}
    build: ./backend/sqlserver-sync
    profiles: ["sqlserver-sync"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dinhguide}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-dinhguide}
      SQLSERVER_HOST: ${SQLSERVER_HOST:-host.docker.internal}
      SQLSERVER_PORT: ${SQLSERVER_PORT:-1433}
      SQLSERVER_DATABASE: ${SQLSERVER_DATABASE:-DinhGuide}
      SQLSERVER_USER: ${SQLSERVER_USER:-}
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD:-}
      SQLSERVER_ENCRYPT: ${SQLSERVER_ENCRYPT:-true}
      SQLSERVER_TRUST_CERT: ${SQLSERVER_TRUST_CERT:-false}
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-10000}
    depends_on:
      postgres:
        condition: service_healthy
      database-migration:
        condition: service_completed_successfully
    restart: unless-stopped
  api-gateway:
    image: ghcr.io/${IMAGE_OWNER:-local}/dinh-guide-api-gateway:${IMAGE_TAG:-local}
    build: ./backend/api-gateway
    environment:
      PORT: 4000
      AUTH_SERVICE_URL: http://auth-service:4101
      CONTENT_SERVICE_URL: http://content-service:4106
      NAVIGATION_SERVICE_URL: http://navigation-service:4107
      FEEDBACK_SERVICE_URL: http://feedback-service:4104
      ANALYTICS_SERVICE_URL: http://analytics-service:4105
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      auth-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      navigation-service:
        condition: service_healthy
      feedback-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    ports: ["${GATEWAY_PORT:-4000}:4000"]
    restart: unless-stopped
  frontend:
    image: ghcr.io/${IMAGE_OWNER:-local}/dinh-guide-frontend:${IMAGE_TAG:-local}
    build: ./frontend
    ports: ["${FRONTEND_PORT:-8080}:80"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
